name: Deploy to Tárhely.eu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "somfaikl,$FTP_PASSWORD" sftp://tefiftythree.tarhely.eu <<'EOF'
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --no-perms --verbose \
            --exclude-glob .git \
            --exclude-glob .github/ \
            --exclude-glob tests/ \
            --exclude-glob docs/ \
            --exclude-glob phpunit.xml \
            --exclude-glob composer.json \
            --exclude-glob qr-admin/includes/config.php \
            . public_html
          bye
          EOF
