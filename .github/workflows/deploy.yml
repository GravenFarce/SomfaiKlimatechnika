name: Deploy to Tárhely.eu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "somfaikl,$FTP_PASSWORD" ftp://somfaiklimatechnika.hu <<'EOF'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .github/ \
            --exclude-glob tests/ \
            --exclude-glob docs/ \
            --exclude-glob phpunit.xml \
            --exclude-glob composer.json \
            --exclude-glob qr-admin/includes/config.php \
            . /
          bye
          EOF
